
name: Build zlib_ng-1.0.0-cp314-win_arm64

on:
  workflow_dispatch:

jobs:
  build:
    name: zlib_ng-1.0.0-cp314-win_arm64
    runs-on: windows-11-arm

    steps:
      - name: Checkout python-zlib-ng
        uses: actions/checkout@v4
        with:
          repository: pycompression/python-zlib-ng
          ref: v1.0.0
          submodules: recursive

      - name: Setup Python ARM64
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: arm64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools setuptools-scm

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Test wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName

          if ($wheel -notmatch "win_arm64\.whl$") {
            throw "Expected Windows ARM64 wheel: $wheel"
          }

          python -m pip install --force-reinstall $wheel
          python -c "import zlib_ng.zlib_ng as z; print('zlib-ng version:', z.ZLIBNG_VERSION); assert z.decompress(z.compress(b'hello arm64')) == b'hello arm64'; print('ARM64 wheel OK')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: zlib_ng-1.0.0-cp314-win_arm64
          path: dist/*.whl
          if-no-files-found: error
